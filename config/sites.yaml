  - id: nutrimuscle-es
    name: Nutrimuscle
    base_url: https://es.nutrimuscle.com
    country: ES
    currency: EUR
    language: es
    platform: shopify
    collector: shopify
    status: blocked
    notes: >-
      13/11/2026 : robots.txt 200 (Shopify standard), mais accueil, products.json et sitemap.xml renvoient 403
      (Cloudflare « Just a moment… »), comme l'entrée française. On ne contourne pas : partenariat ou flux
      d'affiliation.

  - id: nutritienda-es
    name: Nutritienda
    base_url: https://www.nutritienda.com
    path_prefix: /es
    country: ES
    currency: EUR
    language: es
    platform: inconnue
    collector: page
    status: blocked
    filters:
      sitemaps: [/es/sitemap/products.xml]
    notes: >-
      13/11/2026 : robots.txt 200 (n'interdit pas notre robot ; sitemap /es/sitemap/products.xml déclaré), mais
      /es, products.json et le sitemap produits renvoient 403 (Cloudflare « Just a moment… »). On ne contourne
      pas. Voie : programme d'affiliation ou demande d'accès.

  - id: prozis-es
    name: Prozis
    base_url: https://www.prozis.com
    path_prefix: /es/es
    country: ES
    currency: EUR
    language: es
    platform: custom
    collector: page
    status: blocked
    filters:
      sitemaps: [https://www.prozis.com/es/es/sitemap_products.gz]
      product_pattern: '/es/es/'
      prefilter_url: true
      hook: prozis
    notes: >-
      13/11/2026 : robots.txt lui-même renvoie 429 à notre robot (comme en France le 11/11). On ne contourne pas.
      Voie : programme d'affiliation Prozis. Structure reprise de l'entrée prozis (FR), sitemap non vérifié.

  - id: xxlnutrition-es
    name: XXL Nutrition
    base_url: https://xxlnutrition.com
    country: ES
    currency: EUR
    language: en
    platform: inconnue
