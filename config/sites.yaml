  - id: hsn-es
    name: HSN
    base_url: https://www.hsnstore.com
    country: ES
    currency: EUR
    language: es
    platform: magento 2 (Hyvä)
    collector: magento
    status: blocked
    filters:
      sitemaps: [/sitemaps/dcom/sitemap.xml]
      product_pattern: '^https://www\.hsnstore\.com/marcas/[^/]+/[^/]+$'
      prefilter_url: true
    notes: >-
      13/11/2026 : robots.txt 200 et permissif, mais l'accueil, products.json et le sitemap renvoient 403
      (page Cloudflare « Just a moment… ») à notre robot. On ne contourne pas. hsnstore.fr renvoie aussi 403
      (« Sorry, you have been blocked ») le même soir : l'entrée hsn (FR) est touchée. Voie : programme
      d'affiliation HSN (utm_source=hsnaffiliate visible dans robots.txt) ou demande d'accès.

  - id: naturitas-es
    name: Naturitas
    base_url: https://www.naturitas.es
    country: ES
    currency: EUR
    language: es
    platform: magento 2
    collector: magento
    status: blocked
    filters:
      sitemaps: [/sitemap.xml]
      product_pattern: '^https://www\.naturitas\.es/p/(?:suplementos|alimentacion/alimentacion-deportiva)/'
      prefilter_url: true
      free_shipping_from: 49
    notes: >-
