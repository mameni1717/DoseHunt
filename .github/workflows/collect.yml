# Alternative au crontab : collecte planifiée sur GitHub Actions, base PostgreSQL hébergée.
# Secrets : DOSEHUNT_DATABASE_URL ; facultatifs : ANTHROPIC_API_KEY, DOSEHUNT_FEED_THEPROTEINWORKS.
name: Collecte DoseHunt

on:
  schedule:
    - cron: "7 */4 * * *"        # UTC : Shopify toutes les 4 h
    - cron: "41 4 * * *"         # UTC : tous les sites une fois par jour
  workflow_dispatch:
    inputs:
      site:
        description: "Identifiant d'un site (vide = selon la planification)"
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DOSEHUNT_DATABASE_URL: ${{ secrets.DOSEHUNT_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOSEHUNT_FEED_THEPROTEINWORKS: ${{ secrets.DOSEHUNT_FEED_THEPROTEINWORKS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[postgres,dev]"
      - run: pytest -q
      - name: Collecte
        run: |
          if [ -n "${{ github.event.inputs.site }}" ]; then
            dosehunt collect --site "${{ github.event.inputs.site }}"
          elif [ "${{ github.event.schedule }}" = "41 4 * * *" ]; then
            dosehunt collect --all
          else
            dosehunt collect --platform shopify
          fi
      - run: dosehunt export -o index.json
      - uses: actions/upload-artifact@v4
        with:
          name: dosehunt-index
          path: index.json
      - run: dosehunt status
