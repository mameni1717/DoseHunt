# Collectes planifiées sur GitHub Actions, directement dans la base Neon (secret DOSEHUNT_NEON_URL).
#   - toutes les 8 h (2 h, 10 h, 18 h UTC) : tous les produits, puis les codes promo des sites, puis les alertes ;
#   - entre deux, toutes les 4 h (6 h, 14 h, 22 h UTC) : seulement le top 50 de chaque catégorie et sous-catégorie.
# Un job par site, en parallèle : chaque site garde son délai poli entre deux requêtes.
# Secrets : DOSEHUNT_NEON_URL ; facultatifs : RESEND_API_KEY, ALERT_FROM (alertes e-mail), DOSEHUNT_FEED_THEPROTEINWORKS.
name: Collecte DoseHunt

on:
  schedule:
    - cron: "17 2,10,18 * * *"     # complète (toutes les 8 h)
    - cron: "17 6,14,22 * * *"     # top 50 (entre deux complètes)
  workflow_dispatch:
    inputs:
      scope:
        description: "full = tous les produits, top = top 50 seulement"
        required: false
        default: "top"
      site:
        description: "Un seul site (vide = tous)"
        required: false

concurrency:
  group: dosehunt-collect
  cancel-in-progress: false

env:
  DOSEHUNT_DATABASE_URL: ${{ secrets.DOSEHUNT_NEON_URL }}
  DOSEHUNT_FEED_THEPROTEINWORKS: ${{ secrets.DOSEHUNT_FEED_THEPROTEINWORKS }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.p.outputs.sites }}
      full: ${{ steps.p.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[postgres]"
      - name: Vérifier la connexion à la base
        run: |
          if [ -z "$DOSEHUNT_DATABASE_URL" ]; then echo "::error::Secret DOSEHUNT_NEON_URL absent"; exit 1; fi
          dosehunt init
      - id: p
        run: |
          if [ -n "${{ github.event.inputs.site }}" ]; then
            echo 'sites=["${{ github.event.inputs.site }}"]' >> "$GITHUB_OUTPUT"
          else
            echo "sites=$(dosehunt sites-json)" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event.schedule }}" = "17 2,10,18 * * *" ] || [ "${{ github.event.inputs.scope }}" = "full" ]; then
            echo "full=1" >> "$GITHUB_OUTPUT"
          else
            echo "full=0" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true          # un site qui refuse le robot (Nutripure) ne fait pas échouer toute la mise à jour
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[postgres]"
      - name: Collecte ${{ matrix.site }}
        run: |
          if [ "${{ needs.plan.outputs.full }}" = "1" ]; then
            dosehunt collect --site "${{ matrix.site }}" --no-llm
          else
            dosehunt collect --site "${{ matrix.site }}" --no-llm --only-top 50
          fi

  after:
    needs: [plan, collect]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_FROM: ${{ secrets.ALERT_FROM }}
      SITE_URL: https://dose-hunt.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[postgres]"
      - name: Codes promo des sites (toutes les 8 h)
        if: needs.plan.outputs.full == '1'
        run: dosehunt codes
      - name: Alertes prix
        run: dosehunt alerts
      - run: dosehunt status
